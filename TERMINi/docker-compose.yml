services:
  termini:
    image: sempervideo/termini:latest
    container_name: termini
    restart: unless-stopped
    ports:
      - "7676:7676"
    volumes:
      - /volume1/docker/termini/data:/app/data
      - /volume1/docker/termini/plugins:/app/plugins
    environment:
      TZ: Europe/Berlin
